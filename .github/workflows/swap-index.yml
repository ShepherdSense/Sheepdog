name: Swap in updated index.html
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/swap-index.yml'
permissions:
  contents: write
jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move updated export over index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv interactive-us-local-events-map.html index.html
          git commit -m "Replace index.html with updated Shep-Herd export (satellite fix + emergency banner)"
          git push
