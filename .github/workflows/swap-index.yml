name: Swap uploaded file to index.html
on:
  push:
    paths:
      - '.github/workflows/swap-index.yml'
permissions:
  contents: write
jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded export over index.html and push
        run: |
          mv interactive-us-local-events-map.html index.html
          git config user.name "ShepherdSense"
          git config user.email "shepherdsense@users.noreply.github.com"
          git add -A
          git commit -m "Replace index.html with Shep-Herd satellite-switch fix export"
          git push
