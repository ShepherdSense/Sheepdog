name: Swap uploaded file to index.html
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  swap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move new page over index.html
        run: |
          set -e
          if [ -f "interactive-us-local-events-map.html" ]; then
            git mv -f "interactive-us-local-events-map.html" "index.html"
            git config user.name "ShepherdSense"
            git config user.email "ShepherdSense@users.noreply.github.com"
            git add -A
            git commit -m "Replace index.html with updated Shep-Herd page"
            git push
          else
            echo "Temporary file not present; nothing to do."
          fi
