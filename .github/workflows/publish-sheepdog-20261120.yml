name: Publish Sheepdog 20261120

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Rename temp file to index.html and commit
        run: |
          if [ -f interactive-us-local-events-map.html ]; then git mv -f interactive-us-local-events-map.html sheepdog-nov20.html; fi
          if [ -f sheepdog-nov20.html ]; then git mv -f sheepdog-nov20.html index.html; fi
          git config user.name ShepherdSense
          git config user.email ShepherdSense@users.noreply.github.com
          if git diff --cached --quiet; then echo "No changes to commit"; else git commit -m "Sheepdog Nov 20 morning edition — 239 pins"; git push; fi
