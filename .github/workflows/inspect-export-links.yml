name: Inspect export download links (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download assets from temporary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/assets
          gh release download tmp-publish-r3 --repo ShepherdSense/Shep-Herd -D /tmp/assets
          ls -l /tmp/assets
      - name: Verify asset byte sizes
        run: |
          check() { s=$(stat -c%s "/tmp/assets/$1"); if [ "$s" = "$2" ]; then echo "OK $1 = $s"; else echo "MISMATCH $1: got $s want $2"; exit 1; fi; }
          check interactive-us-local-events-map.html 11628434
          check family-survival-guide-slideshow.pptx 16776914
          check family-emergency-quick-references-slideshow.pptx 17754711
          check Family_Survival_Travel_Guide_NC_All_100_Counties_USA_2026-10-31.pdf 508469
          check Family_Emergency_Quick_References_and_Logs_2026-10-31.pdf 97201
      - name: Inspect slideshow download links in export
        run: |
          python3 - <<'PYEOF'
          import re, base64
          p = '/tmp/assets/interactive-us-local-events-map.html'
          src = open(p, encoding='utf-8', errors='replace').read()
          print('export chars:', len(src))
          print('=== A: every data: URI blob (mime + size) ===')
          nblob = 0
          for m in re.finditer(r'data:([^;,]{0,120})(;base64)?,', src):
              mime, isb64 = m.group(1), bool(m.group(2))
              start = m.end()
              q = re.search(r'["\']', src[start:start+45000000])
              if not q:
                  print(f'mime={mime!r} base64={isb64} UNTERMINATED'); continue
              payload = src[start:start+q.start()]
              if isb64 and len(payload) > 200000:
                  try: dlen = len(base64.b64decode(payload))
                  except Exception: dlen = 'DECODE-ERR'
              else:
                  dlen = len(payload)
              nblob += 1
              print(f'mime={mime!r} base64={isb64} payload_chars={len(payload)} size={dlen}')
          print('total data: blobs:', nblob)
          print('=== B: anchors with download attribute ===')
          for m in re.finditer(r'<a\\b[^>]*>', src, re.I):
              tag = m.group(0)
              if 'download' in tag.lower():
                  after = re.sub(r'\\s+', ' ', src[m.end():m.end()+120])
                  print('TAG:', tag[:280].replace(chr(10), ' '), 'TEXT:', after[:100])
          print('=== C: href values mentioning pptx/pdf (not data:) ===')
          for m in re.finditer(r'href\\s*=\\s*([\'"])(.{0,300}?)\\1', src, re.I | re.S):
              v = m.group(2)
              if re.search(r'\\.pptx|\\.pdf', v, re.I) and not v.startswith('data:'):
                  print('PATH href:', v[:300].replace(chr(10), ' '))
          print('=== D: JS .href assignments mentioning pptx/pdf/data ===')
          for m in re.finditer(r'\\.href\\s*=\\s*(["\'])', src):
              qch = m.group(1); start = m.end()
              end = src.find(qch, start, start+400)
              val = src[start:end if end != -1 else start+400]
              if re.search(r'\\.pptx|\\.pdf|^data:', val, re.I):
                  print('JS href:', val[:160].replace(chr(10), ' '))
          print('=== E: slideshow section context (first 6 mentions) ===')
          shown = 0
          for m in re.finditer(r'(?i)slideshow', src):
              if shown >= 6: break
              shown += 1
              s = max(0, m.start()-160); e = min(len(src), m.end()+160)
              print('CTX:', re.sub(r'\\s+', ' ', src[s:e])[:360])
          PYEOF
