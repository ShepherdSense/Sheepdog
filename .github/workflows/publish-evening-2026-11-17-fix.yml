name: Publish Sheepdog Nov 17 evening (footer fix)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish evening edition
        run: |
          git config user.name "ShepherdSense"
          git config user.email "shepherdsense@users.noreply.github.com"
          git mv -f interactive-us-local-events-map.html index.html
          git commit -m "Publish Sheepdog Nov 17 evening (footer fix)"
          git push
