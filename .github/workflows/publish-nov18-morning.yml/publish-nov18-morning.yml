name: Publish Nov 18 morning edition

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename map file to index.html
        run: git mv -f interactive-us-local-events-map.html index.html
      - name: Commit and push
        run: |
          git config user.name "ShepherdSense"
          git config user.email "shepherdsense@users.noreply.github.com"
          git commit -m "Publish Sheepdog Nov 18, 2026 morning edition"
          git push
