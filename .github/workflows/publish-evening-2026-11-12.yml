name: Publish evening edition 2026-11-12

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename evening build to index.html
        run: |
          git config user.name "ShepherdSense"
          git config user.email "shepherdsense@users.noreply.github.com"
          git mv -f sheepdog-evening-2026-11-12.html index.html
          git commit -m "Publish Sheepdog evening edition 2026-11-12"
          git push
