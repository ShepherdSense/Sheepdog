name: Publish evening sweep Nov 8 2026
on:
  push:
    paths:
      - .github/workflows/publish-evening.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap temp file into index.html
        run: |
          git config user.name "ShepherdSense"
          git config user.email "ShepherdSense@users.noreply.github.com"
          git mv -f interactive-us-local-events-map.html index.html
          git commit -m "Publish Sheepdog evening sweep Nov 8 2026 (41 pins)"
          git push
