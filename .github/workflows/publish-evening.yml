name: Publish Sheepdog evening build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap evening build into index.html
        run: |
          git config user.name "ShepherdSense"
          git config user.email "shepherdsense@users.noreply.github.com"
          git mv -f interactive-us-local-events-map.html index.html
          git commit -m "Publish Sheepdog Nov 6 evening build as index.html"
          git push
