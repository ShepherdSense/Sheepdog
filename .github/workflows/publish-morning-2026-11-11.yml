name: Publish morning edition Nov 11

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap morning edition into index.html
        run: |
          git config user.name "ShepherdSense"
          git config user.email "ShepherdSense@users.noreply.github.com"
          git mv -f sheepdog-morning-2026-11-11.html index.html
          git commit -m "Sheepdog Nov 11 morning edition (60 pins)"
          git push
