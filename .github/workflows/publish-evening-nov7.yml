name: Publish evening snapshot Nov 7

on:
  push:
    paths:
      - .github/workflows/publish-evening-nov7.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with evening snapshot
        run: |
          git mv -f interactive-us-local-events-map.html index.html
          git config user.name "ShepherdSense"
          git config user.email "ShepherdSense@users.noreply.github.com"
          git commit -m "Publish Nov 7 morning + evening snapshot (27 pins)"
          git push
