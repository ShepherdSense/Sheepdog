name: Publish Sheepdog Nov 7 build

on:
  push:
    paths:
      - '.github/workflows/publish-sheepdog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap new build into index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv -f interactive-us-local-events-map.html index.html
          git commit -m "Publish Sheepdog Nov 7 morning build as index.html"
          git push
