name: Publish Sheepdog Nov 24 morning
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: 'git mv -f interactive-us-local-events-map.html index.html && git config user.name "ShepherdSense" && git config user.email "shepherdsense@example.com" && git commit -m "Sheepdog Nov 24 morning edition: 310 pins" && git push'
