name: Publish evening edition Nov 10

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap evening edition into index.html
        run: |
          git mv -f sheepdog-evening-2026-11-10.html index.html
          git config user.name "ShepherdSense"
          git config user.email "ShepherdSense@users.noreply.github.com"
          git commit -m "Sheepdog Nov 10 evening edition (53 pins)"
          git push














