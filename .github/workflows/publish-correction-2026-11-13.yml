name: Publish correction 2026-11-13

on:
  push:
    paths:
      - '.github/workflows/publish-correction-2026-11-13.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with corrected build
        run: |
          git config user.name ShepherdSense
          git config user.email shepherdsense@users.noreply.github.com
          git mv -f sheepdog-evening-2026-11-13.html index.html
          git commit -m "Publish corrected Sheepdog evening edition 2026-11-13 (108 pins)"
          git push
