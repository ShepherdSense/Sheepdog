name: Publish Sheepdog Nov 10
on:
  push:
    paths:
      - .github/workflows/publish-sheepdog-nov10.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "ShepherdSense"
          git config user.email "shepherdsense@users.noreply.github.com"
          git mv -f interactive-us-local-events-map.html index.html
          git commit -m "Sheepdog Nov 10 morning: 49 pins"
          git push
