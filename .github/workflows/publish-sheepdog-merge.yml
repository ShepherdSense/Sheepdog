name: Publish Sheepdog merge cleanup
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 'Move edition into place'
        run: 'git mv -f sheepdog-merge.html index.html 2>/dev/null || git mv -f interactive-us-local-events-map.html index.html; git config user.name "ShepherdSense"; git config user.email "shepherdsense@users.noreply.github.com"; git commit -m "Sheepdog Nov 22 morning edition, duplicate merge: 286 pins"; git push'
