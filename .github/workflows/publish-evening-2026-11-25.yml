name: Publish Sheepdog evening edition Nov 25
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move evening edition into place
        run: 'git config user.name "ShepherdSense"; git config user.email "shepherdsense@users.noreply.github.com"; git mv -f interactive-us-local-events-map.html index.html; git add -A; git commit -m "Sheepdog evening edition Nov 25: 346 pins"; git push'
