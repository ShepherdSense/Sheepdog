name: Publish evening edition 2026-11-11

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with evening build
        run: |
          git mv -f sheepdog-evening-2026-11-11.html index.html
          git config user.name "ShepherdSense"
          git config user.email "shepherdsense@users.noreply.github.com"
          git commit -m "Publish Sheepdog evening edition 2026-11-11"
          git push origin main
