name: Publish morning edition 2026-11-12

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish morning edition as index.html
        run: |
          git mv -f sheepdog-morning-2026-11-12.html index.html
          git config user.name "ShepherdSense"
          git config user.email "shepherdsense@users.noreply.github.com"
          git commit -m "Publish Sheepdog morning edition 2026-11-12"
          git push origin main
