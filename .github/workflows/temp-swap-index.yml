name: temp-swap-index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-swap-index.yml'
      - 'interactive-us-local-events-map.html'

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap temp export over index.html
        run: |
          set -e
          if [ ! -f interactive-us-local-events-map.html ]; then
            echo "Temp export file not present; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv -f interactive-us-local-events-map.html index.html
          git status --short
          git commit -m "Publish new Shep-Herd index.html export"
          git push
