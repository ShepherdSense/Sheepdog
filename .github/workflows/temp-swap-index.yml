name: temp-swap-index
on:
  workflow_dispatch:
jobs:
  swap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Swap temp file over index.html
        run: |
          git config user.name "ShepherdSense"
          git config user.email "shepherdsense@users.noreply.github.com"
          git mv -f interactive-us-local-events-map.html index.html
          git commit -m "Publish Sheepdog camera-fix build as index.html (temp swap)"
          git push
