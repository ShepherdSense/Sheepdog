name: Temporary index swap
on:
  push:
    paths:
      - .github/workflows/temp-swap-index.yml
permissions:
  contents: write
jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap index.html with temporary upload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv -f interactive-us-local-events-map.html index.html
          git commit -m "Publish new Shep-Herd index.html export"
          git push
