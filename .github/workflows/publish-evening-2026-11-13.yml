name: Publish evening edition 2026-11-13

on:
  push:
    paths:
      - .github/workflows/publish-evening-2026-11-13.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Move evening build to index.html
        run: |
          git config user.name ShepherdSense
          git config user.email shepherdsense@users.noreply.github.com
          git mv -f sheepdog-evening-2026-11-13.html index.html
          git commit -m "Publish Sheepdog evening edition for Nov 13, 2026"
          git push
