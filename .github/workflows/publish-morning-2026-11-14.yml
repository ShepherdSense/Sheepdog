name: Publish Sheepdog MORNING 2026-11-14

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename morning build to index.html
        run: |
          git config user.name ShepherdSense
          git config user.email shepherdsense@users.noreply.github.com
          git mv -f sheepdog-morning-2026-11-14.html index.html
          git commit -m "Publish Sheepdog MORNING edition 2026-11-14"
          git push
