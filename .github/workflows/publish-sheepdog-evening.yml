name: publish-sheepdog-evening

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish evening edition
        run: 'git mv -f sheepdog-evening.html index.html || git mv -f interactive-us-local-events-map.html index.html; git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"; git commit -m "Sheepdog evening edition Nov 21: 273 pins"; git push'
