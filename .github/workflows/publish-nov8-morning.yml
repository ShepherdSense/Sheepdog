name: Publish Nov 8 morning snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with new snapshot
        run: |
          git config user.name "ShepherdSense"
          git config user.email "ShepherdSense@users.noreply.github.com"
          git mv -f interactive-us-local-events-map.html index.html
          git commit -m "Publish Nov 8 morning snapshot (34 pins)"
          git push
