name: Publish morning edition Nov 27
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded file to index.html and publish
        run: 'git config user.name "ShepherdSense"; git config user.email "shepherdsense@users.noreply.github.com"; if [ -f interactive-us-local-events-map.html ]; then git mv -f interactive-us-local-events-map.html index.html; fi; git add -A; git commit -m "Sheepdog morning edition Nov 27: 380 pins"; git push'
