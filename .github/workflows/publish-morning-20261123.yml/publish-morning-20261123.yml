name: Publish Sheepdog morning edition Nov 23
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: 'git mv -f interactive-us-local-events-map.html index.html'
      - run: 'git config user.name "ShepherdSense" && git config user.email "thedracospark@gmail.com" && git commit -m "Sheepdog morning edition Nov 23: 296 pins" && git push'
