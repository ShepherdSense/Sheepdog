name: Publish morning edition 2026-11-13
on:
  push:
    paths:
      - .github/workflows/publish-morning-2026-11-13.yml
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename morning build to index.html and publish
        run: |
          git mv -f sheepdog-morning-2026-11-13.html index.html
          git config user.name "ShepherdSense"
          git config user.email "shepherdsense@users.noreply.github.com"
          git commit -m "Publish Sheepdog morning edition for Fri Nov 13, 2026"
          git push
